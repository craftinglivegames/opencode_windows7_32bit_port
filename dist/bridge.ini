; OCSHell bridge agent configuration.
; Read by tools\bridge_agent.py at startup. Values are plain text.

[bridge]
; HTTP port of the bridge agent itself (listens on 0.0.0.0).
port = 8011

; Shared secret required by POST /start (query ?token=... or X-Token header).
token = ocshell

; Path to opencode.exe: relative to the project root or absolute.
opencode_path = dist\portable\opencode.exe

; Port for "opencode web --hostname 0.0.0.0 --port <web_port>".
web_port = 8090
